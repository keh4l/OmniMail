name: Deploy to Cloudflare

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "android/**"
      - "docs/releases/android/**"
      - ".github/workflows/android-*.yml"
      - "extension/**"
      - "docs/releases/float/**"
      - ".github/workflows/float-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 部署脚本会先按线上 DB 绑定应用未执行的 D1 迁移，再发布 Worker。
      # Worker 已改名为 k-mail；用名称覆盖而不改 wrangler.jsonc，避免与上游冲突。
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_CI_OVERRIDE_NAME: k-mail
